[project]
name = "miabstraction"
version = "0.1.0"
description = "Empirical validation of the transformer abstraction-layer hypothesis"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pyyaml",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
